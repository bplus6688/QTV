name: Build QTV Signed APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.QTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QTV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          KEY_FILE="$RUNNER_TEMP/qtv-release.jks"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/qtv-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEY_FILE" \
            --ks-key-alias qtv \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out QTV-release.apk \
            "$RUNNER_TEMP/qtv-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose QTV-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QTV-Signed-APK
          path: QTV-release.apk
          if-no-files-found: error
